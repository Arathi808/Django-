{% extends 'base.html' %}
{% load static %}
{% block title %}Add Student page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_student.css' %}">
{% endblock %}

{% block content%}
    <form action="" method="post" class="student-form">
        {% csrf_token %}
        <p>
            <label for="">Name: </label>
            <input type="text" placeholder="Enter name" name="name">
        </p>
        <p>
            <label for="">Age: </label>
            <input type="number" placeholder="Enter age" name="age">
        </p>
        <p>
            <label for="">Mark: </label>
            <input type="number" placeholder="Enter mark" name="mark">
        </p>
        <p>
            <label for="">Course: </label>
            <select name="course" id="">
                <option value="" selected disabled>---Select a course---</option>
                {% for course in courses%}
                    <option value="{{course.id}}">{{course.name}}</option>
                {% endfor %}
            </select>
        </p>
        <p>
            <input type="submit" value="Add student">
        </p>
    </form>
{% endblock %}
